name: Release

# Two entry points, deliberately doing different amounts:
#
# - Pushing a `v*` tag builds the zip AND publishes a GitHub release with it.
# - Running this manually builds the zip and attaches it as a workflow artifact
#   only. Nothing is published. That gives a way to inspect exactly what would
#   ship without creating a release, and makes an accidental release impossible
#   from the Actions tab.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    name: Package plugin
    runs-on: ubuntu-latest

    steps:
      - name: Check out
        uses: actions/checkout@v4

      # There is no bundler and no compiler -- the plugin's PHP, CSS and JS all
      # ship as authored. The one build step is minification, below: the sources
      # carry a very large amount of explanatory comment that is worth keeping in
      # the repository and worth nothing to a browser.
      - name: Read version from the plugin header
        id: plugin
        run: |
          version="$(sed -n 's/^[[:space:]]*\*[[:space:]]*Version:[[:space:]]*//p' honest-divi-modules.php | head -1 | tr -d '[:space:]')"

          if [ -z "$version" ]; then
            echo "::error::Could not read Version from the plugin header in honest-divi-modules.php."
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Plugin header version: $version"

      # The header and the constant are two copies of one fact and they drift.
      # This build found the header on 1.32.0 while the constant had reached
      # 1.47.0 -- fifteen bumps apart. Neither is cosmetic: the header is what
      # WordPress shows on the Plugins screen, and the constant is the `$ver`
      # every wp_enqueue_style/script call passes, so a stale one serves browsers
      # a cached stylesheet after an update. Checked on every run, not just on
      # tags, so the drift is caught while it is still one bump wide.
      - name: Verify the header and the version constant agree
        run: |
          header="${{ steps.plugin.outputs.version }}"
          constant="$(sed -n "s/^[[:space:]]*define([[:space:]]*'HONEST_DIVI_MODULES_VERSION'[[:space:]]*,[[:space:]]*'\([^']*\)'.*/\1/p" honest-divi-modules.php | head -1)"

          if [ -z "$constant" ]; then
            echo "::error::Could not read HONEST_DIVI_MODULES_VERSION from honest-divi-modules.php."
            exit 1
          fi

          if [ "$header" != "$constant" ]; then
            echo "::error::Plugin header says '${header}' but HONEST_DIVI_MODULES_VERSION is '${constant}'. Set both to the same value."
            exit 1
          fi

          echo "Header and constant agree: ${header}."

      # The header is what WordPress shows on the Plugins screen, and it has
      # drifted from the internal constant before now (header said 1.0.1 while
      # the code was at 1.15.0). Releasing v1.2.0 from a header that says
      # something else produces a zip nobody can identify, so the tag and the
      # header have to agree before anything is published.
      - name: Verify the tag matches the plugin header
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          header="${{ steps.plugin.outputs.version }}"

          if [ "$tag" != "$header" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} implies version '${tag}' but the plugin header says '${header}'. Update the header (and HONEST_DIVI_MODULES_VERSION) or retag."
            exit 1
          fi

          echo "Tag ${GITHUB_REF_NAME} matches the plugin header."

      - name: Lint every PHP file
        run: |
          # Cheap, and it is the difference between shipping a zip and shipping a
          # zip that fatals on activation.
          find . -path ./build -prune -o -name '*.php' -print0 \
            | xargs -0 -n1 -P4 php -l > /dev/null
          echo "All PHP files parse."

      - name: Stage the package
        id: stage
        run: |
          slug=honest-divi-modules
          version="${{ steps.plugin.outputs.version }}"

          # WordPress installs a plugin by its directory, so the archive has to
          # contain one top-level folder named for the plugin -- not its loose
          # contents.
          mkdir -p "build/${slug}"

          rsync -a ./ "build/${slug}/" \
            --exclude '.git' \
            --exclude '.github' \
            --exclude '.gitignore' \
            --exclude '.superpowers' \
            --exclude 'docs' \
            --exclude 'build' \
            --exclude '.DS_Store'

          echo "slug=$slug" >> "$GITHUB_OUTPUT"
          echo "zipname=${slug}-${version}.zip" >> "$GITHUB_OUTPUT"
          echo "zippath=build/${slug}-${version}.zip" >> "$GITHUB_OUTPUT"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Minified IN PLACE inside the staged copy, at the same paths. The plugin
      # enqueues `assets/css/modules.css` and friends by name, so shipping the
      # minified file under the original name means no PHP has to know a build
      # ever happened, and there is no `.min` variant to keep in step or to pick
      # between at runtime. The repository keeps the readable sources; only the
      # zip is squeezed.
      #
      # esbuild is pinned: it does CSS and JS with one tool, and
      # `--legal-comments=none` takes the `/*! */` blocks a bare `--minify`
      # would preserve. `--target=es2017` stops a future esbuild from emitting
      # syntax older browsers would choke on; the sources are ES5-era already,
      # so nothing is actually downlevelled.
      #
      # lottie.min.js is deliberately absent from both lists. It is third-party
      # and already minified, so re-minifying it is pure risk for no gain.
      - name: Minify CSS and JS
        working-directory: build/${{ steps.stage.outputs.slug }}
        run: |
          set -euo pipefail
          ESBUILD="esbuild@0.28.1"

          css_files="assets/css/modules.css assets/css/vb-fields.css assets/css/vb-overrides.css"
          js_files="assets/js/vb-modules.js assets/js/market-map.js assets/js/testimonials.js"

          before=$(cat $css_files $js_files | wc -c)

          for f in $css_files; do
            npx -y "$ESBUILD" "$f" --minify --legal-comments=none \
              --outfile="$f.tmp" --log-level=warning
            mv "$f.tmp" "$f"
          done

          for f in $js_files; do
            npx -y "$ESBUILD" "$f" --minify --legal-comments=none --target=es2017 \
              --outfile="$f.tmp" --log-level=warning
            mv "$f.tmp" "$f"
          done

          after=$(cat $css_files $js_files | wc -c)
          echo "Minified 6 files: ${before} -> ${after} bytes ($(( 100 - (after * 100 / before) ))% smaller)."

      # A broken minify is silent: the zip still builds, the plugin still
      # activates, and the damage only shows on a page nobody opened before
      # release. These assertions are what make the step above safe to trust.
      #
      # Every content assertion runs through node rather than grep, on purpose.
      # Minified CSS is one 20,000-character line, and the strings worth
      # asserting on contain regex metacharacters -- `data:image/svg+xml` has a
      # `+`, `--hh-card-rule` leads with dashes. Whether those match depends on
      # the grep build: this was written against one that treats `+` as a
      # quantifier in BRE, where the mask assertion silently failed on a file
      # that was perfectly intact. A verification step that can report a false
      # failure -- or worse, a false pass -- is not verification. node does plain
      # substring comparison with no dialect to get wrong.
      - name: Verify the minified assets
        working-directory: build/${{ steps.stage.outputs.slug }}
        run: |
          set -uo pipefail
          fail=0

          for f in assets/js/vb-modules.js assets/js/market-map.js assets/js/testimonials.js; do
            node --check "$f" || { echo "::error::$f no longer parses after minification."; fail=1; }
          done

          # Written to a file through a QUOTED heredoc rather than passed to
          # `node -e '...'`. In the -e form the script is one single-quoted shell
          # word, so a single apostrophe anywhere inside it -- including inside a
          # JavaScript comment -- ends the quoting and hands the remainder to the
          # shell. That is not hypothetical: this step shipped with "Text Hero's"
          # and "Divi's" in its comments and the runner tried to execute `//` as a
          # command, failing the release with "//: Is a directory". A quoted
          # heredoc is interpolated by nothing, so apostrophes, backslashes and
          # `$` are all safe here permanently.
          cat <<'VERIFY_JS' > "$RUNNER_TEMP/verify-assets.js"
          const fs = require("fs");
          const css = ["assets/css/modules.css", "assets/css/vb-fields.css", "assets/css/vb-overrides.css"];
          const js  = ["assets/js/vb-modules.js", "assets/js/market-map.js", "assets/js/testimonials.js"];
          // Load-bearing values a minifier could plausibly mangle. The two masks
          // are the fragile ones: percent-encoded SVGs inside url(), drawing the
          // Text Hero's eyebrow banner and the Member Statement's label banner.
          // Both are asserted by their own path data, so losing either is caught
          // rather than one standing in for the other.
          //
          // The @keyframes are asserted as DEFINITIONS, not just as substrings.
          // Every scroll-in reveal on this site is keyed off them while Divi's
          // own rule holds the element at opacity 0, so a renamed or dropped
          // keyframe does not degrade the animation -- it leaves the content
          // permanently invisible, on a page nobody opened before release.
          const required = [
            "data:image/svg+xml",
            "M0 57V14H324V57",
            "M0 33.97V8.4H244.712",
            "--hh-card-rule",
            "--hh-member-inset",
            "--hh-member-inset-bottom",
            "--hh-statement-banner",
            "open-quote",
            "@keyframes honest-anim-rise",
            "@keyframes honest-anim-fade",
          ];
          let bad = 0;
          const err = (m) => { console.error("::error::" + m); bad = 1; };

          for (const f of css) {
            let d = 0;
            for (const ch of fs.readFileSync(f, "utf8")) {
              if (ch === "{") d++;
              else if (ch === "}" && --d < 0) { err(f + ": unbalanced braces after minification."); break; }
            }
            if (d > 0) err(f + ": " + d + " unclosed block(s) after minification.");
          }

          for (const f of css.concat(js)) {
            if (fs.readFileSync(f, "utf8").includes("/*")) {
              err(f + " still contains block comments; the minify step did not run over it.");
            }
          }

          const modules = fs.readFileSync("assets/css/modules.css", "utf8");
          for (const token of required) {
            if (!modules.includes(token)) err("modules.css lost \"" + token + "\" during minification.");
          }

          process.exit(bad);
          VERIFY_JS
          node "$RUNNER_TEMP/verify-assets.js" || fail=1

          # Third-party and already minified: it must come through byte-identical.
          if ! cmp -s assets/js/lottie.min.js "$GITHUB_WORKSPACE/assets/js/lottie.min.js"; then
            echo "::error::lottie.min.js was modified; it must ship untouched."
            fail=1
          fi

          [ "$fail" -eq 0 ] || exit 1
          echo "Minified assets parse, kept their load-bearing values, and carry no comments."

      - name: Build the zip
        id: build
        run: |
          slug="${{ steps.stage.outputs.slug }}"
          zipname="${{ steps.stage.outputs.zipname }}"

          ( cd build && zip -rq "$zipname" "$slug" )

          echo "zipname=$zipname" >> "$GITHUB_OUTPUT"
          echo "zippath=${{ steps.stage.outputs.zippath }}" >> "$GITHUB_OUTPUT"

      # Asserts the package is actually installable and that no development
      # material leaked into it. A silent packaging mistake is otherwise only
      # discovered by whoever installs the zip.
      - name: Verify the zip contents
        run: |
          slug=honest-divi-modules
          zip="${{ steps.build.outputs.zippath }}"

          echo "--- archive contents (top two levels) ---"
          unzip -Z1 "$zip" | cut -d/ -f1-2 | sort -u

          required=(
            "$slug/honest-divi-modules.php"
            "$slug/includes/dependencies.php"
            "$slug/includes/class-honest-divi-module-base.php"
            "$slug/assets/css/modules.css"
            "$slug/assets/js/vb-modules.js"
            "$slug/assets/js/market-map.js"
            "$slug/assets/js/lottie.min.js"
            "$slug/assets/lottie/market-map.json"
          )

          for path in "${required[@]}"; do
            if ! unzip -Z1 "$zip" | grep -qxF "$path"; then
              echo "::error::Missing from the package: $path"
              exit 1
            fi
          done

          # Anything matching these would mean the excludes above stopped working.
          if unzip -Z1 "$zip" | grep -Eq '(^|/)(\.git/|\.github/|docs/|\.superpowers/|\.DS_Store$)'; then
            echo "::error::Development files leaked into the package:"
            unzip -Z1 "$zip" | grep -E '(^|/)(\.git/|\.github/|docs/|\.superpowers/|\.DS_Store$)'
            exit 1
          fi

          echo "Package looks correct: $(unzip -Z1 "$zip" | wc -l) entries, $(du -h "$zip" | cut -f1)."

      - name: Upload the zip as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.build.outputs.zipname }}
          path: ${{ steps.build.outputs.zippath }}
          if-no-files-found: error

      # Tag pushes only. gh is preinstalled on the runner, so this needs no
      # third-party action and adds no supply-chain surface to a step that holds
      # a write token.
      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "${{ steps.build.outputs.zippath }}" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            --verify-tag
